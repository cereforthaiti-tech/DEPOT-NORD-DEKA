<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fakti Depo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#14222B; --ink2:#4A5B66; --paper:#EDF1EF; --surface:#FFFFFF; --line:#D3DCD9;
  --pine:#0F5B57; --pine-ink:#FFFFFF; --hdr:#0C3B39; --hdr-ink:#EEF7F5;
  --sig:#E5622B; --danger:#B4372F; --ok:#2F855A; --amber:#B7791F; --focus:#1B6FD6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E4EDEB; --ink2:#9FB1AE; --paper:#0E1719; --surface:#162124; --line:#2A3A3D;
    --pine:#35AAA0; --pine-ink:#04211F; --hdr:#0A2523; --hdr-ink:#E4EDEB;
    --sig:#F08A5B; --danger:#F0847B; --ok:#4FB37F; --amber:#E2A83F; --focus:#6AA7F5;
  }
}
:root[data-theme="dark"]{
  --ink:#E4EDEB; --ink2:#9FB1AE; --paper:#0E1719; --surface:#162124; --line:#2A3A3D;
  --pine:#35AAA0; --pine-ink:#04211F; --hdr:#0A2523; --hdr-ink:#E4EDEB;
  --sig:#F08A5B; --danger:#F0847B; --ok:#4FB37F; --amber:#E2A83F; --focus:#6AA7F5;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:28px;font-weight:800}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:600}
p{margin:0 0 10px}
small,.meta{font-size:13px;color:var(--ink2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* controls */
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--pine)}
.btn.pri{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea{min-height:76px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--pine)}
.fld{display:grid;gap:4px;margin-bottom:12px;font-weight:600;font-size:15px}
.fld>span{color:var(--ink)}
.fld small{font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.sp{flex:1}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lcard{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px}
.lcard h1{margin-bottom:4px}
.lcard .sub{color:var(--ink2);margin-bottom:20px}
.err{color:var(--danger);min-height:22px;font-size:14px;margin:0 0 8px}
.demo{margin-top:18px;font-size:14px;color:var(--ink2)}
.demo summary{cursor:pointer;font-weight:600;color:var(--ink)}
.demo ul{padding-left:18px;margin:8px 0}

/* shell */
.shell{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--hdr);color:var(--hdr-ink)}
.brand{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;font-weight:800;font-size:21px}
.who{display:flex;align-items:center;gap:10px;font-size:14px;text-align:right}
.who b{display:block;font-weight:600}
.who span{opacity:.75;font-size:13px;display:block}
.who .btn{background:transparent;color:var(--hdr-ink);border-color:rgba(255,255,255,.35);min-height:38px}
.nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:thin}
.nb{white-space:nowrap;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid transparent;background:transparent;cursor:pointer;font-weight:600;color:var(--ink2)}
.nb:hover{color:var(--ink);border-color:var(--line)}
.nb[aria-current=page]{background:var(--pine);color:var(--pine-ink)}
.ngrp{align-self:center;white-space:nowrap;padding:0 8px 0 14px;margin-left:6px;border-left:1px solid var(--line);color:var(--ink2);font-size:13px}
main{padding:20px 16px 56px;width:100%;max-width:1060px;margin:0 auto;min-width:0}
@media(min-width:900px){
  .shell{grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto 1fr}
  .top{grid-column:1/-1}
  .nav{flex-direction:column;overflow:visible;border-bottom:0;border-right:1px solid var(--line);padding:16px 12px;align-items:stretch}
  .nb{border-radius:10px;text-align:left}
  .ngrp{border-left:0;margin:16px 0 4px;padding:0 14px}
  main{padding:28px 28px 64px}
}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools .fld{margin:0;flex:1;min-width:150px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:14px}
.chip b{font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{border-color:var(--pine);background:color-mix(in srgb,var(--pine) 12%,var(--surface));font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--ink2))}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--ink)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.empty{padding:28px 16px;text-align:center;color:var(--ink2);background:var(--surface);border:1px dashed var(--line);border-radius:14px}

/* invoice cards */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.inv{display:grid;gap:6px;text-align:left;width:100%;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer}
.inv:hover{border-color:var(--pine)}
.r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.r1 strong{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;font-size:19px}
.r2{font-weight:600}
.r3{display:flex;justify-content:space-between;gap:8px;color:var(--ink2);font-size:14px}
.r3 .amt{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;font-size:14px;color:var(--ink2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover{background:color-mix(in srgb,var(--pine) 7%,var(--surface))}
.z{color:var(--ink2)}
.sum{margin-top:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600}

/* depot dock bars: how much of what is left to deliver each depot can cover */
.docks{display:grid;gap:4px;margin-top:8px;min-width:220px}
.dock{display:grid;grid-template-columns:78px 1fr 42px;align-items:center;gap:8px;font-size:13px}
.dock .bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.dock .bar i{display:block;height:100%;background:var(--ok)}
.dock.part .bar i{background:var(--sig)}
.dock.none .bar i{width:0}
.dock .dq{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.dock.none .dq{color:var(--ink2);font-weight:400}
.legend{font-size:13px;color:var(--ink2);margin:8px 0 0}

/* dialog */
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100% - 20px));max-height:92vh;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.wide{width:min(760px,calc(100% - 20px))}
dialog::backdrop{background:rgba(8,18,20,.6)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:22px;line-height:1}
.dbody{padding:16px 18px 20px;overflow:auto;max-height:calc(92vh - 68px)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 16px;margin:12px 0 16px}
.info div span{display:block;font-size:13px;color:var(--ink2)}
.info div b{font-weight:600}
.hist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;font-size:14px}
.hist li{display:grid;grid-template-columns:120px 1fr;gap:8px}
.hist time{color:var(--ink2)}
@media(max-width:520px){.hist li{grid-template-columns:1fr}}
.lines .lhead,.lrow{display:grid;grid-template-columns:1fr 90px 110px 44px;gap:8px;align-items:center}
.lines .lhead{font-size:13px;color:var(--ink2);margin-bottom:4px}
.lrow{margin-bottom:8px}
@media(max-width:560px){
  .lines .lhead{display:none}
  .lrow{grid-template-columns:1fr 1fr 44px}
  .lrow select{grid-column:1/-1}
}
.tot{text-align:right;font-size:18px;margin:6px 0 12px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.opt.off{opacity:.55;cursor:not-allowed}
.opt input{margin-top:5px}
.opt:has(input:checked){border-color:var(--pine);background:color-mix(in srgb,var(--pine) 9%,var(--surface))}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);margin-left:6px;font-weight:600}
.dl-row{display:grid;grid-template-columns:1fr 100px;gap:10px;align-items:center;margin-bottom:10px}
.dl-row small{display:block}
.perms{display:grid;gap:8px}
.perm{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.perm small{display:block}
.perm input{margin-top:5px}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:13px;padding:2px 8px;border-radius:8px;background:color-mix(in srgb,var(--pine) 10%,var(--surface));border:1px solid var(--line)}
.drv{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.ph{width:72px;height:72px;border-radius:12px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;overflow:hidden;padding:0;cursor:pointer;font-family:'Bricolage Grotesque','Figtree',sans-serif;font-weight:800;font-size:22px;color:var(--ink2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.lic{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line);display:block;margin:6px 0}
.lic.big{max-height:70vh;margin:0 auto}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.srow .dot{width:14px;height:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(92vw,460px);padding:12px 16px;border-radius:12px;background:var(--hdr);color:var(--hdr-ink);font-weight:600;font-size:15px;opacity:0;pointer-events:none;z-index:1000}
.toast.show{opacity:1}
.toast.err{background:var(--danger);color:#fff}
.danger-zone{margin-top:28px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--danger) 45%,var(--line));border-radius:12px}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Aplikasyon sa a bezwen JavaScript pou l mache.</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const KEY='fakti-depo-v1';
const PERMS=[
  {k:'inv_view',l:'Wè fakti',d:'Wè lis fakti yo. Si itilizatè a gen yon depo, li wè sèlman fakti ki konsène depo sa a.'},
  {k:'inv_manage',l:'Jere fakti',d:'Antre, modifye ak siprime fakti nan rejis la.'},
  {k:'customers',l:'Jere kliyan',d:'Anrejistre ak modifye kliyan yo.'},
  {k:'products',l:'Jere pwodui',d:'Anrejistre ak modifye lis pwodui yo.'},
  {k:'stock',l:'Rantre stok',d:'Wè stok epi anrejistre rantre nan depo yo.'},
  {k:'transfer',l:'Transfè vè depo',d:'Voye yon fakti bay yon depo ki gen stok disponib.'},
  {k:'deliver',l:'Jere livrezon',d:'Anrejistre livrezon pasyèl oswa konplè.'},
  {k:'finish',l:'Fakti fini',d:'Mete fakti kòm fini, wè lis fakti fini yo epi ekspòte l an PDF.'},
  {k:'archive',l:'Achiv fakti',d:'Achive fakti epi wè achiv la.'},
  {k:'drivers',l:'Jere chofè',d:'Resevwa chofè, pran foto lisans yo epi anrejistre non yo.'},
  {k:'all_depots',l:'Wè tout depo yo',d:'Pa limite a yon sèl depo (si itilizatè a gen yon depo).'}
];
const KINDS={
  pending:'Kòmansman (non livrée)', transfer:'Transfè vè yon depo', partial:'Livrezon pasyèl',
  full:'Livrezon konplè', finished:'Fakti fini', archived:'Fakti achive', custom:'Lòt stati (chanje men)'
};
const CORE=['pending','transfer','partial','full','finished','archived'];

/* ---------- helpers ---------- */
const $=(s,r)=> (r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const nf=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2});
const num=n=>nf.format(n).replace(/[\u202f\u00a0]/g,' ');
const fmtMoney=n=>num(n)+' HTG';
function toDate(s){return new Date(String(s).length===10?s+'T12:00:00':s);}
const fmtDate=s=>toDate(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
const fmtDateTime=s=>{const d=toDate(s);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});};
const fv=f=>Object.fromEntries(new FormData(f));
const fld=(label,inner,hint)=>'<label class="fld"><span>'+label+'</span>'+inner+(hint?'<small>'+hint+'</small>':'')+'</label>';
let tt;
function toast(m,t){const el=$('#toast');el.textContent=m;el.className='toast show '+(t||'');clearTimeout(tt);tt=setTimeout(()=>{el.className='toast';},3400);}

/* ---------- storage ---------- */
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.v===1)return d;}}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Pa ka sove done yo: espas navigatè a plen. Eseye retire kèk foto.','err');}}
function setMe(id){try{if(id)localStorage.setItem(KEY+'-me',id);else localStorage.removeItem(KEY+'-me');}catch(e){}}
function getMe(){try{return localStorage.getItem(KEY+'-me');}catch(e){return null;}}

/* ---------- seed data ---------- */
function seedData(){
  const day=n=>new Date(Date.now()-n*864e5).toISOString();
  const ds=n=>day(n).slice(0,10);
  const all=PERMS.map(p=>p.k);
  const respPerms=all.filter(k=>k!=='all_depots');
  const d={v:1,seq:5};
  d.depots=[{id:'d1',name:'Depot 1'},{id:'d2',name:'Depot 2'}];
  d.roles=[
    {id:'admin',name:'Administratè',desc:'Kontwòl total. Sèl wòl ki entegre nan aplikasyon an.',perms:all,fixed:true},
    {id:'r_resp',name:'Responsab depo',desc:'Resevwa chofè yo, jere fakti, stok, transfè ak livrezon nan depo li a.',perms:respPerms},
    {id:'r_ajan',name:'Ajan fakti',desc:'Antre fakti ak kliyan nan rejis la.',perms:['inv_view','inv_manage','customers','all_depots']}
  ];
  d.users=[
    {id:'u_admin',name:'Administratè',username:'admin',password:'admin123',roleId:'admin',depotId:'',active:true},
    {id:'u_r1',name:'Responsab Depot 1',username:'resp1',password:'1234',roleId:'r_resp',depotId:'d1',active:true},
    {id:'u_r2',name:'Responsab Depot 2',username:'resp2',password:'1234',roleId:'r_resp',depotId:'d2',active:true},
    {id:'u_aj',name:'Ajan fakti',username:'ajan',password:'1234',roleId:'r_ajan',depotId:'',active:true}
  ];
  d.statuses=[
    {id:'st_pending',name:'Non livrée',kind:'pending',color:'#B7791F'},
    {id:'st_transfer',name:'Transfert vers',kind:'transfer',color:'#2B6CB0'},
    {id:'st_partial',name:'Partiellement livrée',kind:'partial',color:'#C05621'},
    {id:'st_full',name:'Livraison complète',kind:'full',color:'#2F855A'},
    {id:'st_finished',name:'Facture finie',kind:'finished',color:'#4A5568'},
    {id:'st_archived',name:'Facture archivée',kind:'archived',color:'#805AD5'}
  ];
  d.customers=[
    {id:'c1',name:'Boutik Marie-Ange',phone:'3712 4455',address:'Delmas 33'},
    {id:'c2',name:'Mini-Market Bon Voizinaj',phone:'3801 2290',address:'Pétion-Ville'},
    {id:'c3',name:'Kay Jean-Robert',phone:'4455 0912',address:'Tabarre'}
  ];
  d.products=[
    {id:'p1',name:'Diri Miami 25 lb',code:'DIR-25',unit:'sak',price:1450},
    {id:'p2',name:'Lwil pwa 1 L (bwat 12)',code:'LWI-12',unit:'bwat',price:2650},
    {id:'p3',name:'Sik 25 kg',code:'SIK-25',unit:'sak',price:2300},
    {id:'p4',name:'Farin 25 kg',code:'FAR-25',unit:'sak',price:2900},
    {id:'p5',name:'Espageti 500 g (bwat 20)',code:'ESP-20',unit:'bwat',price:1150},
    {id:'p6',name:'Savon lesiv (bwat 24)',code:'SAV-24',unit:'bwat',price:1900},
    {id:'p7',name:'Lèt poud 400 g (bwat 12)',code:'LET-12',unit:'bwat',price:4200},
    {id:'p8',name:'Sadin (bwat 48)',code:'SAD-48',unit:'bwat',price:3800}
  ];
  d.stock={
    d1:{p1:120,p2:60,p3:40,p4:25,p5:80,p6:30,p7:0,p8:20},
    d2:{p1:30,p2:200,p3:0,p4:70,p5:10,p6:150,p7:90,p8:45}
  };
  d.moves=[
    {id:'m1',date:day(14),type:'in',depotId:'d1',productId:'p1',qty:150,ref:'Rantre inisyal',by:'Responsab Depot 1'},
    {id:'m2',date:day(14),type:'in',depotId:'d2',productId:'p2',qty:200,ref:'Rantre inisyal',by:'Responsab Depot 2'},
    {id:'m3',date:day(9),type:'in',depotId:'d2',productId:'p7',qty:90,ref:'Rantre founisè',by:'Responsab Depot 2'}
  ];
  d.drivers=[

{const id=getMe();me=(S.users.find(u=>u.id===id&&u.active))||null;}

/* ---------- lookups ---------- */
const byId=(a,id)=>a.find(x=>x.id===id);
const custById=id=>byId(S.customers,id);
const prodById=id=>byId(S.products,id);
const depotById=id=>byId(S.depots,id);
const driverById=id=>byId(S.drivers,id);
const invById=id=>byId(S.invoices,id);
const roleById=id=>byId(S.roles,id);
const stById=id=>byId(S.statuses,id);
const stByKind=k=>S.statuses.find(s=>s.kind===k);
const custName=id=>(custById(id)||{name:'(kliyan siprime)'}).name;
const isAdmin=()=>!!me&&me.roleId==='admin';
const can=k=>{if(!me)return false;if(me.roleId==='admin')return true;const r=roleById(me.roleId);return !!r&&r.perms.indexOf(k)>=0;};
const myDepot=()=>(!me||isAdmin()||can('all_depots')||!me.depotId)?null:me.depotId;
const visibleDepots=()=>{const d=myDepot();return d?S.depots.filter(x=>x.id===d):S.depots;};

/* ---------- invoice math ---------- */
const kindOf=i=>(stById(i.statusId)||stByKind('pending')||{kind:'pending'}).kind;
const isClosed=i=>{const k=kindOf(i);return k==='finished'||k==='archived';};
const delQty=(i,lid)=>i.deliveries.reduce((a,d)=>a+d.lines.filter(x=>x.lineId===lid).reduce((b,x)=>b+x.qty,0),0);
const remQty=(i,l)=>Math.max(0,l.qty-delQty(i,l.id));
const invTotal=i=>i.lines.reduce((a,l)=>a+l.qty*l.price,0);
const fullyDelivered=i=>i.lines.every(l=>remQty(i,l)<=0);
const hasDeliveries=i=>i.deliveries.length>0;
const stockOf=(dep,pid)=>((S.stock[dep]||{})[pid])||0;
function addStock(dep,pid,q){S.stock[dep]=S.stock[dep]||{};S.stock[dep][pid]=(S.stock[dep][pid]||0)+q;}
function logMove(type,dep,pid,q,ref){S.moves.unshift({id:uid('m'),date:new Date().toISOString(),type:type,depotId:dep,productId:pid,qty:q,ref:ref||'',by:me.name});if(S.moves.length>400)S.moves.length=400;}
function hist(inv,text){inv.history.push({date:new Date().toISOString(),by:me.name,text:text});}
function statusLabel(inv){
  const st=stById(inv.statusId)||stByKind('pending');let n=st.name;
  if(st.kind==='transfer'&&inv.transferDepotId){const d=depotById(inv.transferDepotId);if(d)n+=' '+d.name;}
  return n;
}
function pill(inv){const st=stById(inv.statusId)||stByKind('pending');return '<span class="pill" style="--c:'+esc(st.color)+'">'+esc(statusLabel(inv))+'</span>';}
function visibleInvoices(){
  const dep=myDepot();
  return S.invoices.filter(i=>{
    if(!dep)return true;
    if(i.createdBy===me.id)return true;
    if(i.transferDepotId===dep)return true;
    if(i.deliveries.some(d=>d.depotId===dep))return true;
    return i.lines.some(l=>stockOf(dep,l.productId)>0);
  });
}

/* ---------- finished / archived lists ---------- */
function filterFin(kind){
  let list=visibleInvoices().filter(i=>kindOf(i)===kind);
  const f=kind==='finished'?'finishedAt':'archivedAt';
  const q=ui.q.trim().toLowerCase();
  if(q)list=list.filter(i=>(i.number+' '+custName(i.customerId)).toLowerCase().indexOf(q)>=0);
  if(ui.from)list=list.filter(i=>(i[f]||i.date).slice(0,10)>=ui.from);
  if(ui.to)list=list.filter(i=>(i[f]||i.date).slice(0,10)<=ui.to);
  list.sort((a,b)=>(b[f]||b.date).localeCompare(a[f]||a.date));
  return list;
}
function finListHTML(){
  const kind=ui.page==='done'?'finished':'archived';
  const f=kind==='finished'?'finishedAt':'archivedAt';
  const list=filterFin(kind);
  if(!list.length)return '<p class="empty">Pa gen fakti '+(kind==='finished'?'fini':'achive')+' pou chwa sa a.</p>';

function openInv(id){
  const inv=invById(id);if(!inv){closeDlg();return;}

function invDetailHTML(inv){
  const c=custById(inv.customerId)||{name:'(kliyan siprime)',phone:''};
  const dr=driverById(inv.driverId),dep=depotById(inv.transferDepotId);
  const k=kindOf(inv),closed=isClosed(inv),vd=visibleDepots();
  const info=[['Kliyan',c.name+(c.phone?', '+c.phone:'')],['Dat fakti',fmtDate(inv.date)],['Chofè',dr?dr.name:'—']];
  if(dep)info.push(['Depo responsab',dep.name]);
  if(inv.finishedAt)info.push(['Dat fini',fmtDateTime(inv.finishedAt)]);
  if(inv.archivedAt)info.push(['Dat achivaj',fmtDateTime(inv.archivedAt)]);
  if(inv.note)info.push(['Nòt',inv.note]);
  let anyDock=false;
  const rows=inv.lines.map(l=>{
    const p=prodById(l.productId)||{name:'(pwodui siprime)',unit:''};
    const d=delQty(inv,l.id),r=Math.max(0,l.qty-d);
    let docks='';
    if(!closed&&r>0){
      anyDock=true;
      docks='<div class="docks">'+vd.map(x=>{
        const s=stockOf(x.id,l.productId);const cls=s>=r?'ok':(s>0?'part':'none');const w=Math.min(100,Math.round(s/r*100));
        return '<div class="dock '+cls+'" title="'+esc(x.name)+': '+s+' an stok pou '+r+' ki rete"><span class="dn">'+esc(x.name)+'</span><span class="bar"><i style="width:'+w+'%"></i></span><span class="dq">'+s+'</span></div>';
      }).join('')+'</div>';
    }
    return '<tr><td><strong>'+esc(p.name)+'</strong><br><small>'+fmtMoney(l.price)+' pa '+esc(p.unit||'inite')+'</small>'+docks+'</td><td class="n">'+l.qty+'</td><td class="n">'+d+'</td><td class="n">'+r+'</td><td class="n">'+fmtMoney(l.qty*l.price)+'</td></tr>';
  }).join('');
  const customSt=S.statuses.filter(s=>s.kind==='custom');
  const acts=[];
  if(can('inv_manage')&&!closed&&!hasDeliveries(inv))acts.push('<button class="btn" data-a="inv-edit" data-id="'+inv.id+'">Modifye</button>');
  if(can('transfer')&&!closed&&!fullyDelivered(inv))acts.push('<button class="btn" data-a="inv-transfer" data-id="'+inv.id+'">Transfè vè depo</button>');
  if(can('deliver')&&!closed&&!fullyDelivered(inv))acts.push('<button class="btn pri" data-a="inv-deliver" data-id="'+inv.id+'">Anrejistre livrezon</button>');
  if(customSt.length&&!closed&&(can('inv_manage')||can('transfer')||can('deliver')))acts.push('<button class="btn" data-a="inv-status" data-id="'+inv.id+'">Chanje stati</button>');
  if(can('finish')&&k==='full')acts.push('<button class="btn pri" data-a="inv-finish" data-id="'+inv.id+'">Mete kòm fini</button>');
  if(can('archive')&&k==='finished')acts.push('<button class="btn pri" data-a="inv-archive" data-id="'+inv.id+'">Achive fakti</button>');
  return '<div>'+pill(inv)+'</div>'+
    '<div class="info">'+info.map(x=>'<div><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>').join('')+'</div>'+
    '<div class="tw"><table><thead><tr><th>Pwodui</th><th class="n">Kant.</th><th class="n">Livre</th><th class="n">Rete</th><th class="n">Total</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    (anyDock?'<p class="legend">Ba yo montre kisa chak depo ka kouvri nan sa ki rete pou livre (vèt: tout, oranj: yon pati, vid: anyen). Nimewo a se stok la.</p>':'')+
    '<p class="tot">Total: <strong>'+fmtMoney(invTotal(inv))+'</strong></p>'+
    (acts.length?'<div class="acts">'+acts.join('')+'</div>':'')+
    '<h3 style="margin-top:20px">Istorik</h3><ul class="hist">'+inv.history.slice().reverse().map(h=>'<li><time>'+fmtDateTime(h.date)+'</time><span>'+esc(h.text)+' <small>('+esc(h.by)+')</small></span></li>').join('')+'</ul>';
}

function saveInv(f){
  const v=fv(f),number=(v.number||'').trim();
  if(!number)return toast('Antre nimewo fakti a.','err');
  if(S.invoices.some(i=>i.number.toLowerCase()===number.toLowerCase()&&i.id!==ctx.id))return toast('Nimewo fakti sa a egziste deja.','err');
  if(!v.date)return toast('Antre dat fakti a.','err');
  if(!v.customerId)return toast('Chwazi yon kliyan.','err');
  const lines=ctx.lines.filter(l=>l.productId);
  if(!lines.length)return toast('Ajoute omwen yon pwodui.','err');
  if(lines.some(l=>!(Number(l.qty)>0)))return toast('Chak liy dwe gen yon kantite plis pase 0.','err');
  if(lines.some(l=>!(Number(l.price)>=0)))return toast('Pri a pa ka negatif.','err');
  const ids=lines.map(l=>l.productId);
  if(new Set(ids).size!==ids.length)return toast('Yon pwodui parèt de fwa. Mete kantite yo ansanm nan yon sèl liy.','err');
  const clean=lines.map(l=>({id:l.id,productId:l.productId,qty:Number(l.qty),price:Number(l.price)}));
  let inv=ctx.id?invById(ctx.id):null;
  if(inv){
    inv.number=number;inv.date=v.date;inv.customerId=v.customerId;inv.driverId=v.driverId||'';inv.note=(v.note||'').trim();inv.lines=clean;
    hist(inv,'Fakti modifye');
  }else{
    inv={id:uid('i'),number:number,customerId:v.customerId,driverId:v.driverId||'',date:v.date,note:(v.note||'').trim(),createdAt:new Date().toISOString(),createdBy:me.id,
      lines:clean,statusId:(stByKind('pending')||{}).id,transferDepotId:null,deliveries:[],finishedAt:null,archivedAt:null,history:[]};
    hist(inv,'Fakti anrejistre nan rejis la');
    S.invoices.push(inv);S.seq++;
  }
  save();render();openInv(inv.id);toast('Fakti '+inv.number+' sove.');
}

function transferDlg(id){
  const inv=invById(id);
  const lines=inv.lines.filter(l=>remQty(inv,l)>0);

    const cov=lines.map(l=>({p:prodById(l.productId)||{name:'?'},need:remQty(inv,l),have:stockOf(d.id,l.productId)}));
    return {d:d,cov:cov,any:cov.some(c=>c.have>0),full:cov.every(c=>c.have>=c.need)};
  });
  const pick=(opts.find(o=>o.d.id===inv.transferDepotId&&o.any)||opts.find(o=>o.full)||{d:{}}).d.id;
  openDlg('Transfè fakti '+inv.number,
    '<form id="ff"><p>Chwazi yon depo ki gen stok disponib pou sa ki rete pou livre a.</p><div class="opts">'+
    opts.map(o=>'<label class="opt'+(o.any?'':' off')+'"><input type="radio" name="dep" value="'+o.d.id+'"'+(o.any?'':' disabled')+(o.d.id===pick?' checked':'')+'><span><strong>'+esc(o.d.name)+'</strong>'+
      '<span class="tag">'+(o.full?'Stok konplè':(o.any?'Stok pasyèl':'Pa gen stok'))+'</span><br>'+
      '<small>'+o.cov.map(c=>esc(c.p.name)+': '+c.have+' / '+c.need).join('<br>')+'</small></span></label>').join('')+
    '</div><div class="acts"><span class="sp"></span><button type="button" class="btn" data-a="inv-open" data-id="'+id+'">Retounen</button><button class="btn pri">Transfere</button></div></form>',
    f=>{
      const dep=fv(f).dep;if(!dep)return toast('Chwazi yon depo.','err');
      inv.transferDepotId=dep;inv.statusId=(stByKind('transfer')||{}).id||inv.statusId;
      hist(inv,'Transfè vè '+depotById(dep).name);save();render();openInv(id);toast('Fakti transfere.');
    });
}
function deliverDlg(id,depId){
  const inv=invById(id);const deps=visibleDepots();
  const lines=inv.lines.filter(l=>remQty(inv,l)>0);
  if(!depId){
    const t=deps.find(d=>d.id===inv.transferDepotId);
    depId=(t||deps.find(d=>lines.some(l=>stockOf(d.id,l.productId)>0))||deps[0]||{}).id;
  }
  openDlg('Livrezon fakti '+inv.number,
    '<form id="ff">'+fld('Depo ki livre','<select name="dep" data-c="dl-dep" data-id="'+id+'">'+deps.map(d=>'<option value="'+d.id+'"'+(d.id===depId?' selected':'')+'>'+esc(d.name)+'</option>').join('')+'</select>')+
    '<p class="meta">Kantite yo ranpli ak sa ki disponib nan depo a. Chanje yo si w ap fè yon livrezon pasyèl.</p>'+
    lines.map(l=>{
      const p=prodById(l.productId)||{name:'?'};const rem=remQty(inv,l);const st=stockOf(depId,l.productId);const mx=Math.min(rem,st);
      return '<div class="dl-row"><div><strong>'+esc(p.name)+'</strong><small>Rete: '+rem+', stok '+esc((depotById(depId)||{name:''}).name)+': '+st+'</small></div>'+
        '<input type="number" min="0" max="'+mx+'" step="any" inputmode="decimal" name="q_'+l.id+'" data-max="'+mx+'" value="'+mx+'" aria-label="Kantite pou '+esc(p.name)+'"></div>';
    }).join('')+
    '<div class="acts"><span class="sp"></span><button type="button" class="btn" data-a="inv-open" data-id="'+id+'">Retounen</button><button class="btn pri">Anrejistre livrezon</button></div></form>',
    f=>{
      const dep=fv(f).dep;const items=[];
      for(const l of lines){
        const inp=f.elements['q_'+l.id];const q=Number(inp.value)||0;
        if(q<0)return toast('Kantite pa ka negatif.','err');
        if(q>Math.min(remQty(inv,l),stockOf(dep,l.productId)))return toast('Kantite a depase sa ki rete oswa sa ki an stok.','err');
        if(q>0)items.push({l:l,q:q});
      }
      if(!items.length)return toast('Antre omwen yon kantite pou livre.','err');
      items.forEach(x=>{addStock(dep,x.l.productId,-x.q);logMove('out',dep,x.l.productId,x.q,inv.number);});
      inv.deliveries.push({id:uid('dv'),date:new Date().toISOString(),depotId:dep,by:me.name,lines:items.map(x=>({lineId:x.l.id,qty:x.q}))});
      const full=fullyDelivered(inv);
      const st=stByKind(full?'full':'partial');if(st)inv.statusId=st.id;
      hist(inv,(full?'Livrezon konplè':'Livrezon pasyèl')+' depi '+depotById(dep).name);
      save();render();openInv(id);toast(full?'Livrezon konplè anrejistre.':'Livrezon pasyèl anrejistre.');
    },true);
}

function readPhoto(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{
      const max=900,s=Math.min(1,max/Math.max(img.width,img.height));
      const w=Math.round(img.width*s),h=Math.round(img.height*s);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg',0.72));};
      img.onerror=()=>rej(new Error('img'));img.src=fr.result;};
    fr.onerror=()=>rej(new Error('read'));fr.readAsDataURL(file);
  });
}

    fld('Wòl','<select name="roleId"'+(locked?' disabled':'')+'>'+S.roles.map(r=>'<option value="'+r.id+'"'+(r.id===u.roleId?' selected':'')+'>'+esc(r.name)+'</option>').join('')+'</select>')+
    fld('Depo','<select name="depotId"><option value="">Tout depo yo (pa gen limit)</option>'+S.depots.map(d=>'<option value="'+d.id+'"'+(d.id===u.depotId?' selected':'')+'>'+esc(d.name)+'</option>').join('')+'</select>','Si yon depo chwazi, itilizatè a wè sèlman fakti ak stok depo sa a (sof si wòl li gen pèmisyon « Wè tout depo yo »).')+
    (locked?'':'<label class="perm"><input type="checkbox" name="active"'+(u.active?' checked':'')+'><span>Kont aktif<small>Yon kont dezaktive pa ka antre nan aplikasyon an.</small></span></label>')+
    '<div class="acts">'+(id&&!locked&&id!==me.id?'<button type="button" class="btn danger" data-a="usr-del" data-id="'+id+'">Siprime</button>':'')+'<span class="sp"></span><button type="button" class="btn" data-a="dclose">Anile</button><button class="btn pri">Sove</button></div></form>',
    f=>{
      const v=fv(f);const un=v.username.trim().toLowerCase();
      if(!v.name.trim())return toast('Antre non itilizatè a.','err');
      if(!un)return toast('Antre yon non itilizatè.','err');
      if(S.users.some(x=>x.username.toLowerCase()===un&&x.id!==id))return toast('Non itilizatè sa a deja pran.','err');
      if(!id&&!v.password)return toast('Antre yon modpas.','err');
      const rec={name:v.name.trim(),username:un,depotId:v.depotId||'',active:locked?true:('active' in v)};
      if(!locked)rec.roleId=v.roleId;
      if(v.password)rec.password=v.password;
      if(id){Object.assign(byId(S.users,id),rec);if(id===me.id)me=byId(S.users,id);}
      else S.users.push(Object.assign({id:uid('u')},rec));
      save();closeDlg();render();toast('Itilizatè sove.');
    });
}
function pageRol(){
  return '<div class="phead"><h1>Wòl ak pèmisyon</h1><button class="btn pri" data-a="rol-new">Nouvo wòl</button></div>'+
    '<div class="grid2">'+S.roles.map(r=>{
      const n=S.users.filter(u=>u.roleId===r.id).length;

      '<div class="meta">'+n+' itilizatè</div>'+(r.fixed?'':'<div class="acts" style="margin:0"><button class="btn sm" data-a="rol-edit" data-id="'+r.id+'">Modifye</button></div>')+'</div>';
    }).join('')+'</div>';
}

    '<form id="ff" novalidate>'+fld('Non wòl','<input name="name" value="'+esc(r.name)+'" required data-af>')+

    '<div class="acts">'+(id?'<button type="button" class="btn danger" data-a="rol-del" data-id="'+id+'">Siprime</button>':'')+'<span class="sp"></span><button type="button" class="btn" data-a="dclose">Anile</button><button class="btn pri">Sove wòl la</button></div></form>',

      const v=fv(f);if(!v.name.trim())return toast('Antre non wòl la.','err');

      if(id)Object.assign(roleById(id),rec);else S.roles.push(Object.assign({id:uid('r')},rec));

/* ---------- statuses, depots ---------- */
function pageSta(){
  return '<div class="phead"><h1>Stati fakti</h1><button class="btn pri" data-a="sta-new">Nouvo stati</button></div>'+
    '<p class="meta">Ou ka chanje non ak koulè stati yo, ajoute lòt stati epi chanje lòd yo. Stati debaz yo (livrezon, fini, achiv) gen yon konpòtman fiks epi yo pa ka siprime.</p>'+
    S.statuses.map((s,ix)=>'<div class="srow"><i class="dot" style="--c:'+esc(s.color)+'"></i><div><strong>'+esc(s.name)+(s.kind==='transfer'?' + non depo a':'')+'</strong><br><small>'+esc(KINDS[s.kind]||'')+'</small></div>'+
      '<div class="acts" style="margin:0"><button class="btn sm" data-a="sta-up" data-id="'+s.id+'" aria-label="Monte"'+(ix===0?' disabled':'')+'>↑</button><button class="btn sm" data-a="sta-down" data-id="'+s.id+'" aria-label="Desann"'+(ix===S.statuses.length-1?' disabled':'')+'>↓</button><button class="btn sm" data-a="sta-edit" data-id="'+s.id+'">Modifye</button></div></div>').join('');
}
function staForm(id){
  const s=id?stById(id):{name:'',color:'#2B6CB0',kind:'custom'};

    '<form id="ff" novalidate>'+fld('Non stati a','<input name="name" value="'+esc(s.name)+'" required data-af>',s.kind==='transfer'?'Non depo a ap ajoute apre non sa a (egzanp: Transfert vers Depot 1).':'')+

      if(id){Object.assign(stById(id),{name:v.name.trim(),color:v.color});}

function pageDep(){
  return '<div class="phead"><h1>Depo</h1><button class="btn pri" data-a="dep-new">Nouvo depo</button></div>'+
    S.depots.map(d=>{
      const items=Object.values(S.stock[d.id]||{}).reduce((a,b)=>a+b,0);

    }).join('')+
    '<div class="danger-zone"><h3>Done egzanp</h3><p class="meta">Efase tout done yo (fakti, kliyan, stok, itilizatè) epi remete done egzanp yo. Sa pa ka defèt.</p><button class="btn danger" data-a="reset">Remete done egzanp</button></div>';
}
function depForm(id){
  const d=id?depotById(id):{name:''};
  openDlg(id?'Modifye depo':'Nouvo depo',
    '<form id="ff" novalidate>'+fld('Non depo a','<input name="name" value="'+esc(d.name)+'" required data-af>')+
    '<div class="acts">'+(id?'<button type="button" class="btn danger" data-a="dep-del" data-id="'+id+'">Siprime</button>':'')+'<span class="sp"></span><button type="button" class="btn" data-a="dclose">Anile</button><button class="btn pri">Sove</button></div></form>',
    f=>{
      const v=fv(f);if(!v.name.trim())return toast('Antre non depo a.','err');
      if(id)depotById(id).name=v.name.trim();else{const nd={id:uid('d'),name:v.name.trim()};S.depots.push(nd);S.stock[nd.id]={};}
      save();closeDlg();render();toast('Depo sove.');
    });
}

/* ---------- PDF ---------- */
async function exportPdf(){
  const kind=ui.page==='done'?'finished':'archived';
  const J=window.jspdf&&window.jspdf.jsPDF;
  if(!J)return toast('Bibliyotèk PDF la pa chaje. Verifye koneksyon entènèt la epi eseye ankò.','err');
  const list=filterFin(kind);
  if(!list.length)return toast('Pa gen fakti pou ekspòte.','err');
  const f=kind==='finished'?'finishedAt':'archivedAt';
  const doc=new J({unit:'pt',format:'a4'});
  const M=40;const cols=[
    {h:'# Fakti',x:M,w:70},{h:'Kliyan',x:M+70,w:180},{h:'Dat fakti',x:M+250,w:80},
    {h:'Total (HTG)',x:M+330,w:100,r:true},{h:kind==='finished'?'Dat fini':'Dat achivaj',x:M+430,w:85}
  ];
  let y=56;
  doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(20,34,43);
  doc.text(kind==='finished'?'Lis fakti fini':'Lis fakti achive',M,y);y+=18;
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(74,91,102);
  let per='Jenere le '+fmtDateTime(new Date().toISOString());
  if(ui.from||ui.to)per+='   Peryòd: '+(ui.from?fmtDate(ui.from):'...')+' a '+(ui.to?fmtDate(ui.to):'...');
  doc.text(per,M,y);y+=22;
  const head=()=>{
    doc.setFillColor(15,91,87);doc.rect(M,y-13,515,20,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(255,255,255);
    cols.forEach(c=>{if(c.r)doc.text(c.h,c.x+c.w-6,y,{align:'right'});else doc.text(c.h,c.x+6,y);});
    y+=20;doc.setFont('helvetica','normal');doc.setTextColor(20,34,43);
  };
  head();
  list.forEach((i,ix)=>{
    if(y>780){doc.addPage();y=50;head();}
    if(ix%2===1){doc.setFillColor(238,242,240);doc.rect(M,y-13,515,20,'F');}
    let cn=custName(i.customerId);const w=cols[1].w-12;
    if(doc.getTextWidth(cn)>w){while(cn.length>1&&doc.getTextWidth(cn+'...')>w)cn=cn.slice(0,-1);cn+='...';}
    doc.text(i.number,cols[0].x+6,y);doc.text(cn,cols[1].x+6,y);doc.text(fmtDate(i.date),cols[2].x+6,y);
    doc.text(num(invTotal(i)),cols[3].x+cols[3].w-6,y,{align:'right'});
    doc.text(i[f]?fmtDate(i[f]):'-',cols[4].x+6,y);
    y+=20;
  });
  if(y>790){doc.addPage();y=50;}
  y+=8;doc.setDrawColor(150,160,160);doc.line(M,y-12,M+515,y-12);
  doc.setFont('helvetica','bold');doc.text(list.length+' fakti',M+6,y);
  doc.text('Total: '+num(list.reduce((a,i)=>a+invTotal(i),0))+' HTG',M+515-6,y,{align:'right'});
  const blob=doc.output('blob');
  const fn=(kind==='finished'?'fakti-fini-':'fakti-achive-')+new Date().toISOString().slice(0,10)+'.pdf';
  let dl=null;
  try{dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;}catch(e){dl=null;}
  if(dl){
    try{await dl.save({filename:fn,data:blob});toast('PDF la pare.');}
    catch(e){if(!e||e.code!=='declined')toast('Pa ka sove PDF la.','err');}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

/* ---------- login ---------- */
function doLogin(f){
  const v=fv(f);const un=(v.u||'').trim().toLowerCase();
  const u=S.users.find(x=>x.username.toLowerCase()===un&&x.password===v.p);
  const err=$('#lerr');
  if(!u){err.textContent='Non itilizatè oswa modpas la pa bon.';return;}
  if(!u.active){err.textContent='Kont sa a dezaktive. Kontakte administratè a.';return;}
  me=u;setMe(u.id);ui.page='inv';ui.fs='all';ui.q='';ui.from='';ui.to='';render();
}

/* ---------- delete guards ---------- */
function guardedDelete(kind,id){
  if(kind==='cust'){
    if(S.invoices.some(i=>i.customerId===id))return msgDlg('Siprime kliyan','Kliyan sa a gen fakti. Li pa ka siprime.');
    return askDlg('Siprime kliyan','Kliyan an ap siprime.','Siprime',()=>{S.customers=S.customers.filter(c=>c.id!==id);save();closeDlg();render();toast('Kliyan siprime.');},true);
  }
  if(kind==='prod'){
    if(S.invoices.some(i=>i.lines.some(l=>l.productId===id))||Object.values(S.stock).some(m=>(m[id]||0)>0))return msgDlg('Siprime pwodui','Pwodui sa a gen stok oswa li nan yon fakti. Li pa ka siprime.');
    return askDlg('Siprime pwodui','Pwodui a ap siprime.','Siprime',()=>{S.products=S.products.filter(p=>p.id!==id);Object.values(S.stock).forEach(m=>{delete m[id];});save();closeDlg();render();toast('Pwodui siprime.');},true);
  }
  if(kind==='drv'){
    if(S.invoices.some(i=>i.driverId===id))return msgDlg('Siprime chofè','Chofè sa a gen fakti ki lye avè l. Li pa ka siprime.');
    return askDlg('Siprime chofè','Chofè a ak foto lisans li ap siprime.','Siprime',()=>{S.drivers=S.drivers.filter(d=>d.id!==id);save();closeDlg();render();toast('Chofè siprime.');},true);
  }
  if(kind==='usr'){
    return askDlg('Siprime itilizatè','Itilizatè a ap siprime.','Siprime',()=>{S.users=S.users.filter(u=>u.id!==id);save();closeDlg();render();toast('Itilizatè siprime.');},true);
  }
  if(kind==='rol'){
    if(S.users.some(u=>u.roleId===id))return msgDlg('Siprime wòl','Gen itilizatè ki gen wòl sa a. Chanje wòl yo anvan.');
    return askDlg('Siprime wòl','Wòl la ap siprime.','Siprime',()=>{S.roles=S.roles.filter(r=>r.id!==id);save();closeDlg();render();toast('Wòl siprime.');},true);
  }
  if(kind==='sta'){
    if(S.invoices.some(i=>i.statusId===id))return msgDlg('Siprime stati','Gen fakti ki gen stati sa a. Chanje stati yo anvan.');
    return askDlg('Siprime stati','Stati a ap siprime.','Siprime',()=>{S.statuses=S.statuses.filter(s=>s.id!==id);save();closeDlg();render();toast('Stati siprime.');},true);
  }
  if(kind==='dep'){
    const used=S.users.some(u=>u.depotId===id)||S.invoices.some(i=>i.transferDepotId===id||i.deliveries.some(d=>d.depotId===id))||Object.values(S.stock[id]||{}).some(q=>q>0);
    if(used)return msgDlg('Siprime depo','Depo sa a gen stok, itilizatè oswa fakti ki lye avè l. Li pa ka siprime.');
    return askDlg('Siprime depo','Depo a ap siprime.','Siprime',()=>{S.depots=S.depots.filter(d=>d.id!==id);delete S.stock[id];save();closeDlg();render();toast('Depo siprime.');},true);
  }
}

/* ---------- actions ---------- */
const PAGES={inv:pageInv,done:pageFin,arch:pageFin,cust:pageCust,prod:pageProd,stock:pageStock,drv:pageDrv,usr:pageUsr,rol:pageRol,sta:pageSta,dep:pageDep};
function moveStatus(id,dir){
  const i=S.statuses.findIndex(s=>s.id===id),j=i+dir;
  if(i<0||j<0||j>=S.statuses.length)return;
  const t=S.statuses[i];S.statuses[i]=S.statuses[j];S.statuses[j]=t;save();render();
}
const A={
  nav(el){ui.page=el.dataset.p;ui.q='';ui.from='';ui.to='';ui.fs='all';render();},
  logout(){me=null;setMe(null);closeDlg();render();},
  dclose(){closeDlg();},
  fs(el){ui.fs=el.dataset.v;render();},
  'inv-open'(el){openInv(el.dataset.id);},
  'inv-new'(){invForm(null);},
  'inv-edit'(el){invForm(el.dataset.id);},
  'inv-del'(el){delInvDlg(el.dataset.id);},
  'inv-transfer'(el){transferDlg(el.dataset.id);},
  'inv-deliver'(el){deliverDlg(el.dataset.id);},
  'inv-status'(el){statusDlg(el.dataset.id);},
  'inv-finish'(el){finishDlg(el.dataset.id);},
  'inv-archive'(el){archiveDlg(el.dataset.id);},
  'line-add'(){ctx.lines.push({id:uid('l'),productId:'',qty:1,price:0});$('#lines').innerHTML=linesHTML();updTot();},
  'line-del'(el){if(ctx.lines.length<2)return;ctx.lines=ctx.lines.filter(l=>l.id!==el.dataset.lid);$('#lines').innerHTML=linesHTML();updTot();},
  'cust-new'(){custForm(null);},'cust-edit'(el){custForm(el.dataset.id);},'cust-del'(el){guardedDelete('cust',el.dataset.id);},
  'prod-new'(){prodForm(null);},'prod-edit'(el){prodForm(el.dataset.id);},'prod-del'(el){guardedDelete('prod',el.dataset.id);},
  'stock-in'(){stockForm();},
  'drv-new'(){drvForm(null);},'drv-edit'(el){drvForm(el.dataset.id);},'drv-del'(el){guardedDelete('drv',el.dataset.id);},
  'drv-photo'(el){const d=driverById(el.dataset.id);if(!d)return;if(!d.photo)return drvForm(d.id);openDlg('Lisans '+d.name,'<img class="lic big" src="'+esc(d.photo)+'" alt="Foto lisans '+esc(d.name)+'"><div class="acts"><span class="sp"></span><button type="button" class="btn" data-a="dclose">Fèmen</button></div>');},
  'drv-photo-clear'(){dctx.photo='';$('#pv').innerHTML=photoPrev();},
  'usr-new'(){usrForm(null);},'usr-edit'(el){usrForm(el.dataset.id);},'usr-del'(el){guardedDelete('usr',el.dataset.id);},
  'rol-new'(){rolForm(null);},'rol-edit'(el){rolForm(el.dataset.id);},'rol-del'(el){guardedDelete('rol',el.dataset.id);},
  'sta-new'(){staForm(null);},'sta-edit'(el){staForm(el.dataset.id);},'sta-del'(el){guardedDelete('sta',el.dataset.id);},
  'sta-up'(el){moveStatus(el.dataset.id,-1);},'sta-down'(el){moveStatus(el.dataset.id,1);},
  'dep-new'(){depForm(null);},'dep-edit'(el){depForm(el.dataset.id);},'dep-del'(el){guardedDelete('dep',el.dataset.id);},
  pdf(){exportPdf();},
  reset(){askDlg('Remete done egzanp','Tout done ou yo ap efase epi done egzanp yo ap retounen. Ou ap dekonekte.','Remete tout bagay',()=>{S=seedData();me=null;setMe(null);save();closeDlg();ui.page='inv';render();toast('Done egzanp yo remete.');},true);}
};
const C={
  'dl-dep'(el){deliverDlg(el.dataset.id,el.value);},
  async photo(el){
    const file=el.files&&el.files[0];if(!file)return;
    try{dctx.photo=await readPhoto(file);$('#pv').innerHTML=photoPrev();}
    catch(e){toast('Pa ka li foto a. Eseye yon lòt imaj.','err');}
  }
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el||el.disabled)return;
  const fn=A[el.dataset.a];if(fn)fn(el,e);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr.click')){e.preventDefault();openInv(e.target.dataset.id);}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='lf')doLogin(f);else if(f.id==='ff'&&dlgSubmit)dlgSubmit(f);
});
function refreshList(){const el=$('#list');if(!el)return;el.innerHTML=ui.page==='inv'?invListHTML():finListHTML();}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.in){ui[t.dataset.in]=t.value;refreshList();return;}
  if(t.dataset&&t.dataset.lf&&t.dataset.lf!=='productId'&&ctx){
    const row=t.closest('.lrow');const l=ctx.lines.find(x=>x.id===row.dataset.lid);
    if(l){l[t.dataset.lf]=Number(t.value)||0;updTot();}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.lf==='productId'&&ctx){
    const row=t.closest('.lrow');const l=ctx.lines.find(x=>x.id===row.dataset.lid);
    if(l){l.productId=t.value;const p=prodById(t.value);if(p)l.price=p.price;$('#lines').innerHTML=linesHTML();updTot();}
    return;
  }
  const c=t.dataset&&t.dataset.c;if(c&&C[c])C[c](t,e);
});
const dlg=$('#dlg');
dlg.addEventListener('click',e=>{if(e.target===dlg)closeDlg();});
dlg.addEventListener('close',()=>{dlgSubmit=null;});

render();
})();
</script>
